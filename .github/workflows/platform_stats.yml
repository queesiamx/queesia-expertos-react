name: Update Platform Stats

on:
  workflow_dispatch: {}
  schedule:
    # Diario 09:05 UTC (ajústalo si quieres)
    - cron: "5 9 * * *"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Run stats updater
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/updatePlatformStats.js
